<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alatka-batch-param-admin</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/tom-select/dist/css/tom-select.bootstrap5.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-table/dist/bootstrap-table.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/infra.css}">
</head>
<body>
<div class="container mt-4">
    <div class="card mb-3">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h5 class="mb-0">参数查询</h5>
            <button class="btn btn-sm btn-outline-secondary"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#cardCollapse"
                    aria-expanded="true"
                    aria-controls="cardCollapse">
                <i class="bi bi-arrows-angle-contract"></i>
            </button>
        </div>
        <div class="card-body collapse show" id="cardCollapse">
            <form id="searchForm" class="row g-3">
                <div class="col-md-3">
                    <label for="name" class="form-label">名称</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="输入名称">
                </div>
                <div class="col-md-3">
                    <label for="key" class="form-label">参数键</label>
                    <input type="text" class="form-control" id="key" name="key" placeholder="输入参数键">
                </div>
                <div class="col-md-6">
                    <label for="desc" class="form-label">描述</label>
                    <input type="text" class="form-control" id="desc" name="desc" placeholder="输入描述">
                </div>
                <div class="col-md-3">
                    <label for="type" class="form-label">类型</label>
                    <select class="form-select alk-select-type" id="type" name="type">
                        <option value="" selected>全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="clazz" class="form-label">Java 类型</label>
                    <select class="form-select alk-select-clazz" id="clazz" name="clazz">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="identifying" class="form-label">Identifying</label>
                    <select class="form-select alk-select-identifying" id="identifying" name="identifying">
                        <option value="" selected>全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="enabled" class="form-label">是否可用</label>
                    <select class="form-select alk-select-enabled" id="enabled" name="enabled">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-12 text-center">
                    <button type="button" class="btn btn-secondary me-2" id="resetButton">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                    <button type="button" class="btn btn-primary" id="searchButton">
                        <i class="bi bi-search"></i> 查询
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div class="col-12 text-end mb-3">
        <button type="button" class="btn btn-sm btn-outline-info" id="addButton"
                onclick="showEditModal('/batch/param/create', true)">
            <i class="bi bi-plus-lg"></i> 新增
        </button>
        <button type="button" class="btn btn-sm btn-outline-warning" id="editButton"
                onclick="showEditModal('/batch/param/update', false)">
            <i class="bi bi-pencil-square"></i> 更新
        </button>
        <button type="button" class="btn btn-sm btn-danger" id="deleteButton"
                onclick="showDeleteModal('/batch/param/delete')">
            <i class="bi bi-trash"></i> 删除
        </button>
    </div>

    <table id="dataTable"
           data-toggle="table"
           data-method="get"
           data-url="/batch/param/page"
           data-sort-name="id"
           data-sort-order="desc"
           data-striped="true"
           data-pagination="true"
           data-pagination-loop="false"
           data-side-pagination="server"
           data-click-to-select="true"
           data-maintain-selected="true">
        <thead>
        <tr>
            <th data-radio="true"></th>
            <th data-field="id">ID</th>
            <th data-field="createBy">创建人</th>
            <th data-field="createAt" data-sortable="true">创建日期</th>
            <th data-field="updateBy">更新人</th>
            <th data-field="updateAt" data-sortable="true">更新日期</th>
            <th data-field="name" data-sortable="true">名称</th>
            <th data-field="key">参数键</th>
            <th data-field="value">参数值</th>
            <th data-field="desc">描述</th>
            <th data-field="type" data-formatter="typeFormatter">类型</th>
            <th data-field="clazz" data-align="center" data-formatter="clazzFormatter">Java 类型</th>
            <th data-field="identifying" data-align="center" data-formatter="identifyingFormatter">Identifying</th>
            <th data-field="enabled" data-align="center" data-formatter="enabledFormatter">是否可用</th>
        </tr>
        </thead>
    </table>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑参数</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editForm" class="row g-3">
                    <input type="hidden" id="editId" name="id">
                    <div class="col-4">
                        <label for="editName" class="form-label">名称</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>
                    <div class="col-4">
                        <label for="editKey" class="form-label">参数键</label>
                        <input type="text" class="form-control" id="editKey" name="key" required>
                    </div>
                    <div class="col-4">
                        <label for="editValue" class="form-label">参数值</label>
                        <input type="text" class="form-control" id="editValue" name="value" required>
                    </div>
                    <div class="col-12">
                        <label for="editDesc" class="form-label">描述</label>
                        <input type="text" class="form-control" id="editDesc" name="desc">
                    </div>
                    <div class="col-3">
                        <label for="editType" class="form-label">类型</label>
                        <select class="form-select alk-select-type" id="editType" name="type" required>
                        </select>
                    </div>
                    <div class="col-3">
                        <label for="editClazz" class="form-label">Java 类型</label>
                        <select class="form-select alk-select-clazz" id="editClazz" name="clazz" required>
                        </select>
                    </div>
                    <div class="col-3">
                        <label for="editIdentifying" class="form-label">Identifying</label>
                        <select class="form-select alk-select-identifying" id="editIdentifying" name="identifying"
                                required>
                        </select>
                    </div>
                    <div class="col-3">
                        <label for="editEnabled" class="form-label">是否可用</label>
                        <select class="form-select alk-select-enabled" id="editEnabled" name="enabled" required>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveEditBtn">确认</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">删除参数</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除选中的记录？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="saveDeleteBtn">确认</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/interactjs/dist/interact.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/bootstrap-table/dist/bootstrap-table.min.js}"></script>
<script th:src="@{/webjars/bootstrap-table/dist/locale/bootstrap-table-zh-CN.min.js}"></script>
<script th:src="@{/webjars/tom-select/dist/js/tom-select.complete.min.js}"></script>
<script th:src="@{/js/infra.js}"></script>
<script th:src="@{/js/table.js}"></script>
<script>
    initClazzSelect();
    initEnabledSelect();
    initTypeSelect();
    initIdentifyingSelect();
    preLoad();
    initTable();

    function preLoad() {
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        if (type) {
            let tomSelect = $('#type').get(0).tomselect;
            if (tomSelect) {
                tomSelect.setValue(type);
                tomSelect.lock();
                $(tomSelect.wrapper).addClass('is-readonly-tomSelect');
            }

            const name = urlParams.get('name');
            const key = urlParams.get('key');
            $("#name").val(name).addClass('is-readonly');
            $("#key").val(key);
        }
    }

    function initClazzSelect() {
        httpClient('/batch/param/classes', 'GET', null, function (data) {
            $(".alk-select-clazz").each(function () {
                let tomSelect = new TomSelect(this, {
                    plugins: ['remove_button'],
                    render: {
                        option: function (data, escape) {
                            return `${data.text}`;
                        },
                        item: function (data, escape) {
                            return `${data.text}`;
                        }
                    }
                });
                data.forEach((value) => {
                    tomSelect.addOption({
                        value: value,
                        text: `<div>${clazzFormatter(value)}</div>`
                    });
                });
            });
        });
    }

    function clazzFormatter(value) {
        return `<span class="badge bg-primary">${value}</span>`;
    }

    function initIdentifyingSelect() {
        $(".alk-select-identifying").each(function () {
            let tomSelect = new TomSelect(this, {
                plugins: ['remove_button'],
                options: [{value: true, text: 'Y'}, {value: false, text: 'N'}],
                items: $(this).find("option:selected").length > 0 ? undefined : [true],
                render: {
                    option: function (data, escape) {
                        return `<div>${identifyingFormatter(data.value)}</div>`;
                    },
                    item: function (data, escape) {
                        return `<div>${identifyingFormatter(data.value)}</div>`;
                    }
                }
            });
        });
    }

    function identifyingFormatter(arg) {
        if (arg) {
            return `<span class="badge bg-primary">Y</span>`
        }
        return `<span class="badge bg-secondary">N</span>`;
    }

    function initTypeSelect() {
        $(".alk-select-type").each(function () {
            let tomSelect = new TomSelect(this, {
                plugins: ['remove_button'],
                options: [{value: 'job', text: 'job'}, {value: 'global', text: 'global'}],
                items: $(this).find("option:selected").length > 0 ? undefined : ['global'],
                render: {
                    option: function (data, escape) {
                        return `<div>${typeFormatter(data.value)}</div>`;
                    },
                    item: function (data, escape) {
                        return `<div>${typeFormatter(data.value)}</div>`;
                    }
                }
            });
            console.log($(this).prop("id") + "===========" + tomSelect.items);
        });
    }

    function typeFormatter(arg) {
        if (arg === 'job') {
            return `<span class="badge bg-primary">job</span>`
        }
        return `<span class="badge bg-secondary">global</span>`;
    }
</script>
</body>
</html>
